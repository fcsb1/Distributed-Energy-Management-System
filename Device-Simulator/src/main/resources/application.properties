spring.application.name=device-simulator

###############################################
### RABBITMQ CONFIGURATIONS ###
###############################################
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Queue name (must match monitoring-service)
app.queue.sensor-data=sensor.data.queue

###############################################
### SIMULATOR CONFIGURATIONS ###
###############################################
# Device ID to simulate - CHANGE THIS to match a device in your database
simulator.device-id=${DEVICE_ID:d67cd1be-d2ec-4c8d-ad12-0ef8135ede79}

# Interval in milliseconds between sensor readings
simulator.interval-ms=${INTERVAL_MS:5000}


simulator.fast-demo=true

###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=info
logging.level.com.example.simulator=debug