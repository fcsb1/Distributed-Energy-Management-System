spring.application.name=device-simulator

###############################################
### RABBITMQ CONFIGURATIONS ###
###############################################
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Queue name (must match monitoring-service)
app.queue.sensor-data=sensor.data.queue

###############################################
### SIMULATOR CONFIGURATIONS ###
###############################################
# Device ID to simulate - CHANGE THIS to match a device in your database
simulator.device-id=${DEVICE_ID:5bacb50d-f1cd-4da8-9b0a-133d4dd0bf67}

# Interval in milliseconds between sensor readings
# Production: 600000 (10 minutes)
# Testing: 5000 (5 seconds) or 10000 (10 seconds)
simulator.interval-ms=${INTERVAL_MS:5000}

# Simulate realistic patterns (lower at night, higher in evening)
#simulator.realistic-patterns=true

simulator.fast-demo=true

###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=info
logging.level.com.example.simulator=debug